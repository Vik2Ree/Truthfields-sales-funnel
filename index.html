    <script>
      // Defensive guard: Ensure window.fetch has both getter and setter so browser extensions and interceptors do not error
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(fn) {
            _fetch = fn;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback if property is non-configurable
      }
    </script>
